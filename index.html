<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Premium Mod - Download</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body {
      background: #0a0a0a;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .video-wrapper {
      max-width: 360px;
      margin: 0 auto;
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid #1DB954;
      background: #000;
    }
    .video-wrapper::before {
      content: '';
      display: block;
      padding-top: 177.78%;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
    .spotify-btn {
      background: #1DB954;
      transition: all 0.3s ease;
    }
    .spotify-btn:hover {
      background: #1ed760;
      transform: scale(1.02);
    }
  </style>
</head>
<body class="text-white">
  <div class="max-w-md mx-auto px-5 py-10">

    <!-- Header Minimal -->
    <div class="flex items-center justify-center gap-3 mb-10">
      <div class="w-12 h-12 bg-[#1DB954] rounded-full flex items-center justify-center">
        <i class="fas fa-music text-2xl text-black"></i>
      </div>
      <div>
        <h1 class="text-2xl font-bold tracking-tight">Spotify</h1>
        <p class="text-[#1DB954] text-sm font-medium -mt-1">Premium Mod</p>
      </div>
    </div>

    <!-- Title -->
    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold">Spotify Premium Mod</h2>
      <p class="text-gray-400 mt-2">Full Unlocked • No Ads • Offline Mode</p>
    </div>

    <!-- Warning -->
    <div class="glass rounded-2xl p-5 mb-8">
      <div class="flex gap-3">
        <i class="fas fa-exclamation-circle text-2xl text-yellow-400 mt-0.5"></i>
        <div>
          <p class="font-semibold text-yellow-300">Wajib Tonton Video</p>
          <p class="text-gray-400 text-sm mt-1">Tonton tutorial dulu biar gak bingung pas install.</p>
        </div>
      </div>
    </div>

    <!-- Video -->
    <div class="mb-10">
      <div class="flex items-center justify-between mb-3 px-1">
        <span class="text-sm font-medium text-gray-300 flex items-center gap-2">
          <i class="fas fa-play-circle text-[#1DB954]"></i> Tutorial Install
        </span>
        <span class="text-xs bg-[#1DB954]/20 text-[#1DB954] px-3 py-1 rounded-full">9:16</span>
      </div>
      <div class="video-wrapper">
        <iframe src="https://aceimg.com/upload/?f=u6YutRUzG.mp4" 
                allowfullscreen allow="autoplay"></iframe>
      </div>
    </div>

    <!-- Download Button -->
    <button onclick="handleDownload()" id="downloadBtn"
            class="spotify-btn w-full py-6 rounded-2xl text-xl font-bold text-black flex items-center justify-center gap-3 shadow-lg shadow-green-900/40">
      <i id="btnIcon" class="fas fa-download text-2xl"></i>
      <span id="btnText">DOWNLOAD SEKARANG</span>
    </button>

    <p class="text-center text-gray-500 text-xs mt-10">
      Link aman • Tonton video sampai selesai
    </p>
  </div>

  <script>
    function handleDownload() {
      const btn = document.getElementById('downloadBtn');
      const icon = document.getElementById('btnIcon');
      const text = document.getElementById('btnText');

      btn.disabled = true;
      icon.classList.remove('fa-download');
      icon.classList.add('fa-spinner', 'animate-spin');
      text.textContent = 'MEMPROSES...';

      window.open('https://move2link.co/d0a5766', '_blank');

      setTimeout(() => {
        btn.disabled = false;
        icon.classList.remove('fa-spinner', 'animate-spin');
        icon.classList.add('fa-download');
        text.textContent = 'DOWNLOAD SEKARANG';
      }, 3000);
    }
  </script>
</body>
</html>
